<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Sync - Painel de Escala</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@500&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b0f1a; 
            color: #f1f5f9; 
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b0f1a 50%);
        }

        .glass { 
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Cores de status corrigidas conforme script original */
        .status-finalizada { 
            border-left: 4px solid #10b981 !important; 
            background: rgba(16, 185, 129, 0.08) !important; 
        }
        .status-andamento { 
            border-left: 4px solid #f59e0b !important; 
            background: rgba(245, 158, 11, 0.05) !important; 
        }
        .status-nao-iniciada { 
            border-left: 4px solid #ef4444 !important; 
            background: rgba(239, 68, 68, 0.05) !important; 
        }
        
        .loading-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; }
    </style>
</head>
<body class="min-h-screen p-4 lg:p-8" onload="inicializarPlanilha()">

    <div class="max-w-[1600px] mx-auto space-y-6">
        
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <button onclick="window.history.back()" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-lg transition-all shadow-lg border border-slate-700/50">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </button>
                <div>
                    <h1 class="text-2xl font-black text-white tracking-tight uppercase leading-tight">Painel de Escala</h1>
                    <div class="flex flex-col mt-1">
                        <label class="text-[8px] text-slate-500 font-black uppercase tracking-widest">Filtro por Data de Saída</label>
                        <input type="date" id="filtroData" onchange="carregarDados()" class="bg-transparent text-emerald-400 font-bold text-xs focus:outline-none cursor-pointer">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2 text-[9px] font-black uppercase">
                <div class="px-3 py-2 bg-emerald-500/20 border border-emerald-500/40 rounded text-emerald-400 text-center">Finalizada</div>
                <div class="px-3 py-2 bg-amber-500/20 border border-amber-500/40 rounded text-amber-400 text-center">Em Andamento</div>
                <div class="px-3 py-2 bg-rose-500/20 border border-rose-500/40 rounded text-rose-400 text-center">Não Iniciada</div>
            </div>
        </div>

        <div class="glass rounded-2xl overflow-hidden shadow-2xl border border-slate-800/60">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/80 text-slate-500 text-[10px] font-black uppercase tracking-widest border-b border-slate-800">
                            <th class="p-4">N° Carga</th>
                            <th class="p-4">Saída</th>
                            <th class="p-4">Veículo</th>
                            <th class="p-4">Motorista Atribuído</th>
                            <th class="p-4 text-center">Total</th>
                            <th class="p-4 text-center">Aberto</th>
                            <th class="p-4 text-center">Realizado</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo" class="divide-y divide-slate-800/50 font-mono text-[11px]">
                        <!-- Inserção via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let API_BASE = localStorage.getItem('concept_api_base') || window.location.origin;

        function inicializarPlanilha() {
            document.getElementById('filtroData').valueAsDate = new Date();
            carregarDados();
        }

        async function carregarDados() {
            const corpo = document.getElementById('tabelaCorpo');
            const dataFiltro = document.getElementById('filtroData').value;
            
            corpo.innerHTML = '<tr><td colspan="7" class="p-20 text-center text-slate-500 uppercase font-black text-[10px] tracking-[0.3em] animate-pulse">Sincronizando com Oracle...</td></tr>';

            try {
                const response = await fetch(`${API_BASE}/api/roteirizacao/painel-geral?data=${dataFiltro}`);
                const cargas = await response.json();

                corpo.innerHTML = '';
                
                if (cargas.length === 0) {
                    corpo.innerHTML = '<tr><td colspan="7" class="p-20 text-center text-slate-500 italic text-xs">Nenhuma carga para esta data.</td></tr>';
                    return;
                }

                cargas.forEach(rota => {
                    const tr = document.createElement('tr');
                    tr.id = `linha-${rota.numCar}`;
                    tr.className = "hover:bg-slate-800/20 transition-colors";
                    
                    tr.innerHTML = `
                        <td class="p-4 font-bold text-white">${rota.numCar}</td>
                        <td class="p-4 text-slate-400">${rota.dataSaida}</td>
                        <td class="p-4 text-emerald-400 font-bold">${rota.placa}</td>
                        <td class="p-4 text-slate-300 font-sans font-semibold uppercase">${rota.motorista}</td>
                        <td id="total-${rota.numCar}" class="p-4 text-center font-black">${rota.totalEntregas}</td>
                        <td id="aberto-${rota.numCar}" class="p-4 text-center text-slate-500 font-black loading-pulse">...</td>
                        <td id="realizado-${rota.numCar}" class="p-4 text-center text-slate-500 font-black loading-pulse">...</td>
                    `;
                    corpo.appendChild(tr);

                    processarStatusConcept(rota.numCar, rota.totalEntregas);
                });

            } catch (e) {
                corpo.innerHTML = '<tr><td colspan="7" class="p-20 text-center text-red-500 font-black uppercase text-xs">Erro de Conexão</td></tr>';
            }
        }

        async function processarStatusConcept(numCar, totalDb) {
            try {
                const response = await fetch(`${API_BASE}/api/roteirizacao/itinerario/${numCar}`);
                const xmlText = await response.text();
                
                // LÓGICA PORTADA DO SCRIPT ORIGINAL (processarXMLSeguro)
                // 1. Limpar ocorrências
                const xmlLimpo = xmlText.replace(/<[^>]*listaOcorrencias[^>]*>[\s\S]*?<\/[^>]*listaOcorrencias>/gi, "");
                
                // 2. Extrair todos os conteúdos de tags <status> via Regex (mais seguro que DOMParser para SOAP)
                const regexStatus = /<[^>]*status[^>]*>(.*?)<\/[^>]*status>/gi;
                let matches;
                let totalCarga = 0;
                let aberto = 0;

                while ((matches = regexStatus.exec(xmlLimpo)) !== null) {
                    const statusValor = matches[1].trim().toUpperCase();
                    totalCarga++;
                    if (statusValor === "ABERTO") {
                        aberto++;
                    }
                }

                // Se o XML veio vazio, usamos o total do banco e marcamos tudo como aberto
                if (totalCarga === 0) {
                    totalCarga = totalDb;
                    aberto = totalDb;
                }

                const realizado = Math.max(0, totalCarga - aberto);
                
                // Atualização dos elementos da página
                const elTotal = document.getElementById(`total-${numCar}`);
                const elAberto = document.getElementById(`aberto-${numCar}`);
                const elRealizado = document.getElementById(`realizado-${numCar}`);
                const linha = document.getElementById(`linha-${numCar}`);

                if (elTotal) elTotal.innerText = totalCarga;
                
                if (elRealizado) {
                    elRealizado.innerText = realizado;
                    elRealizado.classList.remove('loading-pulse', 'text-slate-500');
                    elRealizado.classList.add('text-emerald-500');
                }
                
                if (elAberto) {
                    elAberto.innerText = aberto;
                    elAberto.classList.remove('loading-pulse', 'text-slate-500');
                    elAberto.classList.add('text-amber-500');
                }

                // LÓGICA DE PINTURA (DE ACORDO COM O SCRIPT)
                if (linha && totalCarga > 0) {
                    linha.classList.remove('status-finalizada', 'status-andamento', 'status-nao-iniciada');

                    if (aberto === 0) {
                        // Todos realizados
                        linha.classList.add('status-finalizada');
                    } else if (realizado > 0) {
                        // Existe saldo realizado mas ainda tem aberto
                        linha.classList.add('status-andamento');
                    } else {
                        // Realizado = 0 e Total em Aberto
                        linha.classList.add('status-nao-iniciada');
                    }
                }

            } catch (e) {
                console.error("Erro ao processar carga " + numCar, e);
                const elAberto = document.getElementById(`aberto-${numCar}`);
                if (elAberto) {
                    elAberto.innerText = totalDb;
                    elAberto.classList.remove('loading-pulse');
                }
            }
        }
    </script>
</body>
</html>
